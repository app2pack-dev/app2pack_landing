<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="App 2 Pack">
  <title>App 2 Pack</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      padding: 1.5rem;
      color: #fff;
      background:
        radial-gradient(60% 50% at 20% 15%, rgba(167, 139, 250, 0.18), transparent 70%),
        radial-gradient(50% 45% at 85% 85%, rgba(251, 146, 120, 0.14), transparent 70%),
        #0e0e13;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { margin: 0; }
    h1 img { display: block; width: min(640px, 80vw); height: auto; }
    a {
      padding: 0.8rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    a:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.35); }
  </style>
</head>
<body>
  <h1><img src="/logo.svg" alt="App 2 Pack" width="641" height="190"></h1>
  <a href="mailto:support@app2pack.dev">Send us an email</a>
</body>
</html>
