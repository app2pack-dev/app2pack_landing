<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App 2 Pack Games</title>
  <meta name="description" content="Free web games by App 2 Pack. No downloads, no sign-up. Play solo or with friends.">
  <meta name="theme-color" content="#0e0e13">
  <meta property="og:title" content="App 2 Pack Games">
  <meta property="og:description" content="Free web games. No downloads, no sign-up. Play solo or with friends.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #0e0e13;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-hover: rgba(255, 255, 255, 0.1);
      --line: rgba(255, 255, 255, 0.1);
      --text: #fff;
      --muted: rgba(255, 255, 255, 0.62);
      --violet: #a78bfa;
      --coral: #fb9278;
      --radius: 22px;
      --gap: 16px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(55% 40% at 15% 0%, rgba(167, 139, 250, 0.20), transparent 70%),
        radial-gradient(45% 35% at 90% 10%, rgba(251, 146, 120, 0.13), transparent 70%),
        var(--bg);
      background-repeat: no-repeat;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .wrap { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(14, 14, 19, 0.72);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid transparent;
      transition: border-color .2s;
    }
    header.scrolled { border-bottom-color: var(--line); }
    .bar { display: flex; align-items: center; gap: 16px; height: 68px; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand img { height: 30px; width: auto; display: block; }
    .brand span {
      font-weight: 700; font-size: 15px; letter-spacing: .02em;
      padding: 5px 11px; border-radius: 999px;
      background: linear-gradient(135deg, rgba(167,139,250,.22), rgba(251,146,120,.22));
      border: 1px solid rgba(255,255,255,.14);
    }
    .search {
      margin-left: auto; position: relative; width: min(320px, 40vw);
    }
    .search input {
      width: 100%; height: 42px; padding: 0 16px 0 42px;
      border-radius: 999px; border: 1px solid var(--line);
      background: var(--surface); color: var(--text);
      font: inherit; font-size: 15px; outline: none;
      transition: border-color .2s, background .2s;
    }
    .search input::placeholder { color: var(--muted); }
    .search input:focus { border-color: rgba(167,139,250,.6); background: var(--surface-hover); }
    .search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); opacity: .6; }

    /* Hero */
    .hero { padding: 44px 0 28px; }
    .hero h1 {
      margin: 0; font-size: clamp(30px, 5vw, 52px); line-height: 1.05;
      letter-spacing: -0.03em; font-weight: 800;
    }
    .hero h1 em {
      font-style: normal;
      background: linear-gradient(90deg, var(--violet), var(--coral));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero p { margin: 14px 0 0; color: var(--muted); font-size: clamp(15px, 1.6vw, 18px); max-width: 560px; line-height: 1.5; }

    /* Filters */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
    .chip {
      display: inline-flex; align-items: center; gap: 8px;
      height: 42px; padding: 0 16px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface);
      color: var(--text); font: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .2s, border-color .2s, transform .1s;
    }
    .chip:hover { background: var(--surface-hover); }
    .chip:active { transform: scale(.97); }
    .chip .n { font-size: 12px; font-weight: 700; color: var(--muted); }
    .chip[aria-pressed="true"] { background: #fff; color: #111; border-color: #fff; }
    .chip[aria-pressed="true"] .n { color: rgba(0,0,0,.5); }
    .chip.multi[aria-pressed="true"] { background: var(--coral); border-color: var(--coral); }
    .chip.single[aria-pressed="true"] { background: var(--violet); border-color: var(--violet); }

    /* Grid */
    .grid {
      display: grid; gap: var(--gap);
      grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
      grid-auto-flow: dense;
    }
    .tile {
      position: relative; aspect-ratio: 1; border-radius: var(--radius);
      overflow: hidden; text-decoration: none; isolation: isolate;
      container-type: inline-size;
      box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 8px 24px rgba(0,0,0,.35);
      transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
      animation: pop .4s cubic-bezier(.2,.8,.2,1) both;
    }
    .tile.featured { grid-column: span 2; grid-row: span 2; }
    .tile:hover, .tile:focus-visible {
      transform: translateY(-4px) scale(1.025);
      box-shadow: 0 1px 0 rgba(255,255,255,.12) inset, 0 18px 40px rgba(0,0,0,.5), 0 0 0 3px rgba(255,255,255,.9);
      outline: none;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } }

    .art { position: absolute; inset: 0; z-index: -1; }
    .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .art.ph {
      background:
        radial-gradient(circle at 78% 18%, rgba(255,255,255,.35) 0 9%, transparent 9.5%),
        radial-gradient(circle at 12% 88%, rgba(255,255,255,.14) 0 22%, transparent 22.5%),
        radial-gradient(circle at 92% 92%, rgba(0,0,0,.18) 0 30%, transparent 30.5%),
        linear-gradient(140deg, var(--c1), var(--c2));
      display: grid; place-items: center;
    }
    .art.ph i {
      font-style: normal; font-size: 44cqw; line-height: 1; margin-top: -10cqw;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,.3));
      transition: transform .35s cubic-bezier(.2,.8,.2,1);
    }
    .tile:hover .art.ph i { transform: scale(1.1) rotate(-6deg); }

    .badges { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      height: 26px; padding: 0 10px 0 8px; border-radius: 999px;
      font-size: 12px; font-weight: 700; letter-spacing: .01em; white-space: nowrap;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .badge svg { flex: none; }
    .badge.multi { background: var(--coral); color: #2a0f08; box-shadow: 0 4px 12px rgba(251,146,120,.45); }
    .badge.single { background: rgba(14,14,19,.55); color: #fff; }
    .badge.new { background: #fff; color: #111; padding: 0 9px; }

    .meta {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 32px 14px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,.72));
      display: flex; align-items: flex-end; gap: 8px;
    }
    .meta h2 { margin: 0; font-size: 16px; font-weight: 750; line-height: 1.2; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
    .meta small { display: block; margin-top: 2px; font-size: 12.5px; color: rgba(255,255,255,.78); font-weight: 500; }
    .featured .meta { padding: 48px 20px 18px; }
    .featured .meta h2 { font-size: 26px; }
    .featured .meta small { font-size: 14px; }
    .play {
      margin-left: auto; flex: none; width: 36px; height: 36px; border-radius: 50%;
      background: #fff; color: #111; display: grid; place-items: center;
      opacity: 0; transform: scale(.7); transition: opacity .2s, transform .25s cubic-bezier(.2,.8,.2,1);
    }
    .featured .play { width: 52px; height: 52px; opacity: 1; transform: none; }
    .tile:hover .play, .tile:focus-visible .play { opacity: 1; transform: none; }

    .empty { display: none; padding: 60px 0; text-align: center; color: var(--muted); font-size: 16px; }
    .empty.show { display: block; }

    footer { margin-top: 64px; border-top: 1px solid var(--line); }
    footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; padding-top: 24px; padding-bottom: 32px; color: var(--muted); font-size: 14px; }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }

    @media (max-width: 640px) {
      :root { --gap: 12px; --radius: 18px; }
      .wrap { padding: 0 16px; }
      .bar { height: auto; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap; gap: 12px; }
      .brand img { height: 26px; }
      .search { width: 100%; order: 3; }
      .hero { padding: 22px 0 18px; }
      .hero h1 { font-size: 30px; }
      .hero p { margin-top: 10px; font-size: 15px; }
      .tile.featured { grid-row: auto; aspect-ratio: 16 / 11; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .filters { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px 18px; padding: 0 16px; scrollbar-width: none; }
      .filters::-webkit-scrollbar { display: none; }
      .filters { gap: 6px; }
      .chip { flex: none; height: 40px; padding: 0 12px; font-size: 14px; gap: 6px; }
      .meta { padding: 28px 12px 10px; }
      .meta h2 { font-size: 15px; }
      .featured .meta h2 { font-size: 22px; }
      .badge { height: 24px; font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tile, .art.ph i, .play { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <header id="top">
    <div class="wrap bar">
      <a class="brand" href="./" aria-label="App 2 Pack Games, home">
        <img src="logo.svg" alt="App 2 Pack" width="101" height="30">
        <span>Games</span>
      </a>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search games" autocomplete="off" aria-label="Search games">
      </label>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Free games, <em>right in your browser.</em></h1>
      <p>No downloads, no sign-up. Play a quick round on your own, or send a link and play with friends.</p>
    </section>

    <nav class="filters" aria-label="Filter games">
      <button class="chip" data-mode="all" aria-pressed="true">All <span class="n" data-count="all"></span></button>
      <button class="chip multi" data-mode="multi" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="8" r="3.5"/><path d="M2 19c0-3.6 3.1-6 7-6s7 2.4 7 6v1H2z"/><circle cx="17" cy="9" r="2.8" opacity=".7"/><path d="M17.5 13.2c2.7.3 4.5 2.2 4.5 4.8v2h-4v-1c0-2.3-.9-4.3-2.5-5.6.6-.1 1.3-.2 2-.2z" opacity=".7"/></svg>
        Multiplayer <span class="n" data-count="multi"></span>
      </button>
      <button class="chip single" data-mode="single" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c0-4 3.3-6.6 7.5-6.6s7.5 2.6 7.5 6.6v1h-15z"/></svg>
        Single player <span class="n" data-count="single"></span>
      </button>
    </nav>

    <section class="grid" id="grid" aria-live="polite"></section>
    <p class="empty" id="empty">No games match that. Try another name.</p>
  </main>

  <footer>
    <div class="wrap">
      <span>© <span id="yr"></span> App 2 Pack</span>
      <span><a href="https://app2pack.dev">app2pack.dev</a> &nbsp;·&nbsp; <a href="mailto:support@app2pack.dev">support@app2pack.dev</a></span>
    </div>
  </footer>

  <script src="games.js"></script>
  <script>
    (function () {
      var games = window.GAMES || [];
      var grid = document.getElementById('grid');
      var empty = document.getElementById('empty');
      var q = document.getElementById('q');
      var chips = document.querySelectorAll('.chip');
      var mode = (location.hash.slice(1) === 'multiplayer') ? 'multi' : (location.hash.slice(1) === 'single-player') ? 'single' : 'all';

      var ICON_MULTI = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="8" r="3.5"/><path d="M2 19c0-3.6 3.1-6 7-6s7 2.4 7 6v1H2z"/><circle cx="17" cy="9" r="2.8"/><path d="M17.5 13.2c2.7.3 4.5 2.2 4.5 4.8v2h-4v-1c0-2.3-.9-4.3-2.5-5.6.6-.1 1.3-.2 2-.2z"/></svg>';
      var ICON_SINGLE = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c0-4 3.3-6.6 7.5-6.6s7.5 2.6 7.5 6.6v1h-15z"/></svg>';
      var ICON_PLAY = '<svg width="45%" height="45%" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';

      function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
      function players(g) { return g.players ? g.players.replace('-', '–') + ' players' : ''; }

      function tile(g, i) {
        var multi = g.mode === 'multi';
        var c = g.colors || ['#a78bfa', '#fb9278'];
        var art = g.thumb
          ? '<div class="art"><img src="thumbs/' + esc(g.thumb) + '" alt="" loading="lazy"></div>'
          : '<div class="art ph" style="--c1:' + esc(c[0]) + ';--c2:' + esc(c[1]) + '"><i>' + esc(g.emoji || '🎮') + '</i></div>';
        var sub = multi ? (players(g) || 'Play with friends') : 'Play solo';
        var label = g.title + ', ' + (multi ? 'multiplayer' + (g.players ? ', ' + players(g) : '') : 'single player');
        return '<a class="tile' + (g.featured ? ' featured' : '') + '" href="' + esc(g.url) + '" id="' + esc(g.id) + '" aria-label="' + esc(label) + '" style="animation-delay:' + (i * 35) + 'ms">' +
          art +
          '<div class="badges">' +
            (multi ? '<span class="badge multi">' + ICON_MULTI + 'Multiplayer</span>' : '<span class="badge single">' + ICON_SINGLE + 'Single player</span>') +
            (g.isNew ? '<span class="badge new">New</span>' : '') +
          '</div>' +
          '<div class="meta"><div><h2>' + esc(g.title) + '</h2><small>' + esc(sub) + '</small></div><span class="play">' + ICON_PLAY + '</span></div>' +
        '</a>';
      }

      function render() {
        var term = q.value.trim().toLowerCase();
        var list = games.filter(function (g) {
          return (mode === 'all' || g.mode === mode) && (!term || g.title.toLowerCase().indexOf(term) !== -1);
        });
        grid.innerHTML = list.map(tile).join('');
        empty.classList.toggle('show', list.length === 0);
        chips.forEach(function (c) { c.setAttribute('aria-pressed', String(c.dataset.mode === mode)); });
      }

      document.querySelector('[data-count="all"]').textContent = games.length;
      document.querySelector('[data-count="multi"]').textContent = games.filter(function (g) { return g.mode === 'multi'; }).length;
      document.querySelector('[data-count="single"]').textContent = games.filter(function (g) { return g.mode === 'single'; }).length;
      document.getElementById('yr').textContent = new Date().getFullYear();

      chips.forEach(function (c) {
        c.addEventListener('click', function () {
          mode = c.dataset.mode;
          history.replaceState(null, '', mode === 'all' ? location.pathname : '#' + (mode === 'multi' ? 'multiplayer' : 'single-player'));
          render();
        });
      });
      q.addEventListener('input', render);
      var header = document.querySelector('header');
      addEventListener('scroll', function () { header.classList.toggle('scrolled', scrollY > 8); }, { passive: true });

      render();
    })();
  </script>
</body>
</html>
